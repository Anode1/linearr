# Sanitizers: run the unit tests under AddressSanitizer and Undefined-
# BehaviorSanitizer on Linux and macOS, on every push and PR. This is the
# automatic backstop for the memory-safety class of bug (buffer overflow,
# use-after-free, signed overflow, bad shift, misaligned access) that a plain
# -O2 test run cannot see: the tests pass green while the bug stays latent. The
# sanitizers make it abort with a file:line report instead.
#
# macOS is the payoff CI adds over a local run: a different libc and allocator
# catch what a Linux-only ASan cannot. Reproduce any failure locally,
# identically:
#   make ut-asan     # AddressSanitizer
#   make ut-ubsan    # UndefinedBehaviorSanitizer
#
# make cliut runs here too: it drives the built binary through a shell and a
# pseudo-terminal, which is where behaviour the unit tests structurally cannot
# reach lives (a bare run with a terminal on stdin, exit codes, stdout/stderr
# separation).
name: sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  san:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false        # let Linux and macOS both report, even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build (make must actually build)
        run: make && test -x ./linearr
      - name: unit tests
        run: make ut
      - name: CLI black-box tests
        run: make cliut
      - name: strict warnings
        run: make pedantic
      - name: AddressSanitizer
        run: make ut-asan
      - name: UndefinedBehaviorSanitizer
        run: make ut-ubsan
