# Build linearr for every supported platform and attach the binaries to a
# GitHub Release. Binaries are not kept in git: they are made from the tagged
# commit, each with a SHA-256, so any of them can be reproduced from the source
# it names.
#
# Trigger: a tag matching v* (v0.3.0, v1.0.0). It is a pattern, so a tag like
# `nightly` will not start a release. Run it by hand from the Actions tab
# (workflow_dispatch) to exercise the build matrix without publishing.
#
# Windows is built on a Windows runner rather than cross-compiled from Linux.
# The cross-compile works and produces a clean PE32+ binary, but nothing on a
# Linux builder can run it, and shipping a binary nobody has executed is how
# "it links" gets read as "it works".
#
# NOT YET RUN. Only the Linux path of this file has been executed, by hand, one
# step at a time. The macOS, arm64 and Windows paths are untested until the
# first tag. If one of them fails, fail-fast is off so the others still upload,
# and the failing job's log is the whole diagnosis.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write           # to create the Release and upload assets

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # one platform failing must not cancel the others
      matrix:
        include:
          - { os: ubuntu-latest,     name: linux-x86_64 }
          - { os: ubuntu-24.04-arm,  name: linux-arm64 }
          - { os: macos-latest,      name: macos-arm64 }
          - { os: windows-latest,    name: windows-x86_64 }
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 toolchain (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc make zip

      - name: the tag and LINEARR_VERSION must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/.*LINEARR_VERSION "\([^"]*\)".*/\1/p' c/constants.h)
          tag=${GITHUB_REF_NAME#v}
          test "$ver" = "$tag" || {
            echo "tag $GITHUB_REF_NAME says $tag, c/constants.h says $ver."
            echo "dist.sh names the archive from constants.h, so these must match."
            exit 1; }

      - name: build
        run: make

      - name: unit tests
        run: make ut

      # The rest of `make check` needs a pty, python3, a JDK and R. They run on
      # every push in sanitizers.yml; a release build only has to produce a
      # binary that works, so this is the smoke test that it does.
      - name: it fits and scores
        run: |
          ./linearr -t example/longley.csv > model.csv
          ./linearr --version
          grep -q "1829.15146461" model.csv || { echo "Longley is wrong"; exit 1; }

      - name: package
        run: sh scripts/dist.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: linearr-${{ matrix.name }}
          path: dist/linearr-*

  publish:
    name: attach the binaries to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: what is being published
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
