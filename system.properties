# system.properties: linearr's knobs.
# Format: key = value. Blank lines and '#' comments are ignored; spaces around
# the '=' are trimmed. Read one with params_get("key"). Every key here has a
# built-in default in process.c, so the program still runs with this file
# missing; the values below are those defaults, written out.

# Where the fitted model lives: GROUP,Intercept,<one column per term>. That
# header IS the model: the terms it names, in that order, are the polynomial.
# Add a term by adding a column, here and in the training file.
coef.file = conf/coefficients.csv

# GROUP,trim_addition, added to the prediction to get the trim point. Comment
# this out and the trim point is just the prediction.
trim.file = conf/trim_additions.csv

# Rounding, half away from zero. These are not display settings: the rounded
# number is the published figure, and the trim point is built on it.
predict.scale = 4
trim.scale = 1
